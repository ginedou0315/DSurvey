<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DSurvey</title>
<style>
:root{color-scheme:light;--ink:#1b213a;--muted:#58637c;--line:#dce2ee;--accent:#4740be;--wash:#f5f6fc;--soft:#eeedff;font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--wash)}header{background:white;border-bottom:1px solid var(--line)}.bar,main{width:min(100% - 2rem,68rem);margin:auto}.bar{display:flex;align-items:center;min-height:4.5rem}.brand{font-size:1.3rem;font-weight:800;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:.65rem}.mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.6rem;background:var(--accent);color:white;font-size:1rem}main{padding:2.5rem 0 4rem}.narrow{max-width:42rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;letter-spacing:-.045em;margin-bottom:.7rem;overflow-wrap:anywhere}h2{font-size:1.3rem;letter-spacing:-.02em}h3{font-size:1rem}.muted,small{color:var(--muted)}.muted{white-space:pre-wrap;overflow-wrap:anywhere}.lead{margin-bottom:1.8rem}.panel{background:white;border:1px solid var(--line);border-radius:1rem;padding:clamp(1rem,4vw,1.6rem);margin-bottom:1rem}.intro{background:var(--soft);padding:clamp(1.3rem,5vw,3rem);border-color:#dfdcff}.row,.top{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.top{justify-content:space-between}.row>*{margin:0}.stack{display:grid;gap:1rem}.question{border:1px solid var(--line);border-radius:.7rem;padding:1rem}.question .top{margin-bottom:.8rem}.cols{display:grid;gap:.8rem}.cards{display:grid;gap:.8rem;margin-top:1rem}.card{border:1px solid var(--line);border-radius:.7rem;padding:1rem;overflow-wrap:anywhere}.card h3{margin-bottom:.4rem}.button,button{display:inline-flex;justify-content:center;align-items:center;min-height:2.65rem;border:1px solid var(--line);background:white;border-radius:.55rem;padding:.5rem .85rem;color:var(--ink);font:inherit;font-weight:650;text-decoration:none;cursor:pointer}.primary{color:white;background:var(--accent);border-color:var(--accent)}button:hover,.button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:default}.danger{color:#a32743}.check{display:flex;align-items:center;gap:.55rem;font-weight:500}.check input{width:1.15rem;height:1.15rem;margin:0}label{display:grid;gap:.35rem;font-weight:650;font-size:.94rem}input,textarea,select{width:100%;min-width:0;font:inherit;font-size:1rem;color:inherit;border:1px solid #b8c3d7;border-radius:.5rem;padding:.55rem .7rem;background:white}textarea{min-height:5.5rem;resize:vertical}:focus-visible{outline:3px solid #7468e0;outline-offset:3px}.tabs{margin:1.4rem 0}.tabs button[aria-pressed=true]{background:var(--soft);color:#332b98;border-color:#bdb5ff}.status{margin-top:1rem;color:#4436a8}.status:empty{display:none}.status.error{color:#a32743}.badge{background:var(--soft);color:#332b98;border-radius:2rem;padding:.25rem .65rem;font-size:.87rem;font-weight:650}.metric{font-size:2rem;font-weight:800;line-height:1.1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.94rem}th,td{text-align:left;padding:.65rem;vertical-align:top;border-bottom:1px solid var(--line);min-width:8rem;max-width:24rem;overflow-wrap:anywhere;white-space:pre-wrap}th{background:var(--wash)}.linkbox{margin:.8rem 0;display:grid;gap:.5rem}.meter{width:100%;accent-color:var(--accent)}.summary-line{margin:.35rem 0;overflow-wrap:anywhere}.question input[type=text]{width:100%}.brand:visited{color:var(--ink)}[hidden]{display:none!important}
@media(min-width:42rem){.cols{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}}@media(max-width:34rem){main{padding-top:1.5rem}.question .top{align-items:flex-start}.question .row{gap:.35rem}.question button{padding:.45rem .55rem}}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="/"><span class="mark" aria-hidden="true">D</span>DSurvey</a></div></header>
<main id="app" aria-busy="true"></main>
<script src="/assets/reports.js" defer></script>
<script src="/assets/app.js" defer></script>
</body>
</html>
