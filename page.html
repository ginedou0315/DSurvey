<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DSurvey</title>
<style>
:root{color-scheme:light;--ink:#252036;--muted:#595267;--line:#e5deed;--accent:#6840a5;--purple-dark:#523184;--purple-line:#a987d0;--wash:#f7f3fc;--soft:#f1e8fb;--green:#276448;--mint:#e9f7ee;--mint-line:#bddcca;--intro:linear-gradient(120deg,#f0e6fb 0%,#faf7fd 50%,#e1f5e8 100%);font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff}header{background:white;border-bottom:1px solid var(--line)}.bar,main{width:min(100% - 2rem,68rem);margin:auto}.bar{display:flex;align-items:center;min-height:4.5rem}.brand{font-size:1.3rem;font-weight:800;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:.65rem}.mark{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.6rem;background:var(--accent);color:white;font-size:1rem}main{padding:2.5rem 0 4rem}.narrow{max-width:42rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;letter-spacing:-.045em;margin-bottom:.7rem;overflow-wrap:anywhere}h2{font-size:1.3rem;letter-spacing:-.02em}h3{font-size:1rem}.muted,small{color:var(--muted)}.muted{white-space:pre-wrap;overflow-wrap:anywhere}.lead{margin-bottom:1.8rem}.panel{background:white;border:1px solid var(--line);border-radius:1rem;padding:clamp(1rem,4vw,1.6rem);margin-bottom:1rem}.intro{background:var(--intro);padding:clamp(1.3rem,5vw,3rem);border-color:var(--line)}.row,.top{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.top{justify-content:space-between}.row>*{margin:0}.stack{display:grid;gap:1rem}.question{border:1px solid var(--line);border-radius:.7rem;padding:1rem}.question .top{margin-bottom:.8rem}.cols{display:grid;gap:.8rem}.cards{display:grid;gap:.8rem;margin-top:1rem}.card{border:1px solid var(--line);border-radius:.7rem;padding:1rem;overflow-wrap:anywhere}.card h3{margin-bottom:.4rem}.button,button{display:inline-flex;justify-content:center;align-items:center;min-height:2.65rem;border:1px solid var(--line);background:white;border-radius:.55rem;padding:.5rem .85rem;color:var(--ink);font:inherit;font-weight:650;text-decoration:none;cursor:pointer}.primary{color:white;background:var(--accent);border-color:var(--accent)}button:hover,.button:hover{filter:brightness(.95)}button:disabled{opacity:.5;cursor:default}.danger{color:#a32743}.check{display:flex;align-items:center;gap:.55rem;font-weight:500}.check input{width:1.15rem;height:1.15rem;margin:0}label{display:grid;gap:.35rem;font-weight:650;font-size:.94rem}input,textarea,select{width:100%;min-width:0;font:inherit;font-size:1rem;color:inherit;border:1px solid #8c809a;border-radius:.5rem;padding:.55rem .7rem;background:white}textarea{min-height:5.5rem;resize:vertical}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.tabs{margin:1.4rem 0}.tabs button[aria-pressed=true]{background:var(--soft);color:var(--purple-dark);border-color:var(--purple-line)}.status{margin-top:1rem;color:var(--green)}.status:empty{display:none}.status.error{color:#a32743}.badge{background:var(--mint);color:var(--green);border-radius:2rem;padding:.25rem .65rem;font-size:.87rem;font-weight:650}.metric{font-size:2rem;font-weight:800;line-height:1.1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.94rem}th,td{text-align:left;padding:.65rem;vertical-align:top;border-bottom:1px solid var(--line);min-width:8rem;max-width:24rem;overflow-wrap:anywhere;white-space:pre-wrap}th{background:var(--wash)}.linkbox{margin:.8rem 0;display:grid;gap:.5rem}.meter{width:100%;accent-color:var(--green)}.summary-line{margin:.35rem 0;overflow-wrap:anywhere}.question input[type=text]{width:100%}.brand:visited{color:var(--ink)}[hidden]{display:none!important}
@media(min-width:42rem){.cols{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}}@media(max-width:34rem){main{padding-top:1.5rem}.question .top{align-items:flex-start}.question .row{gap:.35rem}.question button{padding:.45rem .55rem}}
.home-intro{border-color:var(--mint-line)}
.starters{display:grid;gap:.75rem;margin-bottom:1rem}
.starter{display:grid;justify-content:start;text-align:left;gap:.25rem;padding:1rem 1.15rem;border-radius:.85rem}
.starter:hover{background:var(--soft);border-color:var(--purple-line)}
.starter span{font-weight:400;font-size:.94rem;color:var(--muted)}
.builder-layout{display:grid;gap:1rem;align-items:start}
.builder-edit,.builder-preview{min-width:0}
.builder-preview{display:none;background:var(--mint);border:1px solid var(--mint-line);padding:1rem;border-radius:1rem}
.builder-preview h2{margin-bottom:.35rem}
.builder-preview .intro{padding:1.2rem}
.builder-preview .intro h1{font-size:clamp(1.5rem,4vw,2rem)}
.preview-toggle{margin-bottom:1rem}
.quick-add{background:var(--soft);border-radius:.7rem;padding:.85rem}
.quick-add h2,.builder-edit h2{margin-bottom:0}
.quick-add .row{margin-top:.5rem}
.quick-add button{font-size:.9rem}
@media(max-width:53.99rem){
  .builder-preview.preview-visible{display:block}
  .builder-layout:has(.preview-visible) .builder-edit{display:none}
}
@media(min-width:42rem){.starters{grid-template-columns:repeat(3,1fr)}}
@media(min-width:54rem){
  .builder-layout{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .builder-preview{display:block;position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto}
  .preview-toggle{display:none}
}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="/"><span class="mark" aria-hidden="true">D</span>DSurvey</a></div></header>
<main id="app" aria-busy="true"></main>
<script src="/assets/reports.js" defer></script>
<script src="/assets/app.js" defer></script>
</body>
</html>
